services:
  marquez-db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      MARQUEZ_DB: marquez
      MARQUEZ_USER: marquez
      MARQUEZ_PASSWORD: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
      - ./docker/init-marquez-db.sh:/docker-entrypoint-initdb.d/init-marquez-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  marquez:
    image: marquezproject/marquez:0.50.0
    environment:
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      SEARCH_ENABLED: "false"
    ports:
      - "5000:5000" # API
      - "5001:5001" # admin (healthcheck, metrics)
    depends_on:
      marquez-db:
        condition: service_healthy

  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - marquez

volumes:
  marquez-db-data:
