services:
  marquez-db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      MARQUEZ_DB: marquez
      MARQUEZ_USER: marquez
      MARQUEZ_PASSWORD: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
      - ./docker/init-marquez-db.sh:/docker-entrypoint-initdb.d/init-marquez-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  marquez:
    image: marquezproject/marquez:0.50.0
    environment:
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      SEARCH_ENABLED: "false"
    ports:
      - "5000:5000" # API
      - "5001:5001" # admin (healthcheck, metrics)
    depends_on:
      marquez-db:
        condition: service_healthy

  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - marquez

  # Landing + dbt target - separate from marquez-db on purpose, mirroring
  # the real-world split between orchestration/metadata state and actual
  # data.
  warehouse-db:
    image: postgres:14
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Airflow (M3): orchestration, used only as a vehicle for lineage -
  # LocalExecutor, not the heavier Celery/Redis compose, since Airflow
  # itself isn't what this project is about.
  airflow-db:
    image: postgres:14
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      PYTHONPATH: /opt/airflow
      WAREHOUSE_DSN: postgresql://warehouse:warehouse@warehouse-db:5432/warehouse
      OPENLINEAGE_URL: http://marquez:5000
      OPENLINEAGE_NAMESPACE: lineage-demo
    command:
      - bash
      - -c
      - "airflow db migrate && airflow users create --username airflow --password airflow --firstname Airflow --lastname Admin --role Admin --email airflow@example.com"
    # Assumes the host UID is 1000 (true on this machine) - simplest thing
    # that works for a single-developer local project, not meant to be
    # portable across arbitrary hosts.
    user: "1000:0"
    volumes: &airflow-common-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./pipeline:/opt/airflow/pipeline

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    command: webserver
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    user: "1000:0"
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    command: scheduler
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    user: "1000:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  marquez-db-data:
  warehouse-db-data:
  airflow-db-data:
